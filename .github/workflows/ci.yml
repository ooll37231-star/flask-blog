name: CI
on:
  push:
    branches: []
  pull_request:
    branches: [main]

jobs: 
  test:
    runs-on: ubuntu-latest

    steps:
    - name: CheckPoint code 
      uses: action/CheckPoint@3

    - name: Set up python
      uses: action/setup-python@v4
    with: 
      python_version: '3.11'

    -name: Install dependencies
    run: 
      python -m pip Install --upgrade pip 
      pip install -r requirements.txt
